[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posttrain-timemachine"
version = "0.2.0"
description = "A local-first debugger, counterfactual lab and regression system for GRPO"
readme = "README.en.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "numpy>=2,<3", "pyarrow>=19,<24", "duckdb>=1.2,<2",
  "PyYAML>=6,<7", "typer>=0.15,<1"
]

[project.urls]
Homepage = "https://github.com/renweimeng/posttrain-timemachine"
Repository = "https://github.com/renweimeng/posttrain-timemachine"
Issues = "https://github.com/renweimeng/posttrain-timemachine/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6", "hypothesis>=6", "httpx>=0.28", "ruff>=0.12", "mypy>=1.15", "types-PyYAML"]
trl = ["trl==0.24.0", "transformers==4.57.1", "torch==2.9.0", "accelerate==1.11.0"]

[project.scripts]
ptm = "ptm.cli:main"

[tool.setuptools.packages.find]
include = ["ptm*"]

[tool.setuptools.package-data]
ptm = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["trl: actual pinned TRL integration"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
packages = ["ptm"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

